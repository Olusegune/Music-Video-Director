name: Release

# Builds both editions (the full suite and the standalone Music Video
# Director) and attaches their Windows installers to a GitHub Release.
#
# Trigger by pushing a tag: `git tag v1.5.0 && git push origin v1.5.0`.
# Everything before this workflow existed had to be built and installed by
# hand, one machine at a time — this is what makes an install shareable
# with anyone via a plain download link instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: npm run check

      - name: Build full suite (Director Studio)
        run: npm run tauri build

      - name: Build standalone edition (Wheelbarrow Music Video Director)
        run: npm run tauri:build:mv

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          cp "src-tauri/target/release/bundle/nsis/"*setup.exe dist-installers/ 2>/dev/null || true
          cp "src-tauri/target/release/bundle/msi/"*.msi dist-installers/ 2>/dev/null || true
          ls -la dist-installers

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist-installers/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*
          generate_release_notes: true
