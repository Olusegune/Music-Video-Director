<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Director Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // The native window title (Tauri desktop builds) comes from
      // tauri.conf.json / tauri.mv.conf.json instead — this only covers the
      // browser tab title for `npm run dev` / a web-exported build.
      if (import.meta.env.VITE_PRODUCT_EDITION === "musicvideo") {
        document.title = "Wheelbarrow Music Video Director";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
